
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anitha's Flipkart Login Page</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- Left Login Information Section -->
        <div class="left-section">

            <h1>Login</h1>

            <p>
                Get access to your Orders,
                Wishlist and Recommendations
            </p>

            <!-- Simple Illustration -->
            <div class="illustration">
                <div class="cloud">☁️</div>
                <div class="laptop">
                    <div class="screen">👤</div>
                    <div class="base"></div>
                </div>
                <div class="heart">♥</div>
                <div class="cart">🛒</div>
            </div>

        </div>

        <!-- Right Login Form Section -->
        <div class="right-section">

            <form action="#" method="get">

                <input
                    type="text"
                    placeholder="Enter Email/Mobile number"
                    required
                    pattern="[0-9]{10}|[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}"
                    title="Enter a valid 10-digit mobile number or email address">

                <p class="terms">
                    By continuing, you agree to Flipkart's
                    <a href="#">Terms of Use</a> and
                    <a href="#">Privacy Policy</a>.
                </p>

                <button type="submit">
                    Request OTP
                </button>

                <div class="create-account">
                    <a href="#">
                        New to Flipkart? Create an account
                    </a>
                </div>

            </form>

        </div>

    </div>

    <footer>
        Designed by Anitha Vanamatla | 2026
    </footer>

</body>
</html>
