
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulb ON OFF - Anitha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>JavaScript Bulb ON/OFF</h1>
        <p>Click the buttons to switch the bulb ON or OFF.</p>

        <div class="bulb-container">
            <div id="bulb" class="bulb"></div>
        </div>

        <h2 id="status">Bulb is OFF</h2>

        <div class="buttons">
            <button onclick="turnOn()">Turn ON</button>
            <button onclick="turnOff()">Turn OFF</button>
        </div>

        <footer>
            <p>Created by Anitha Vanamatla | 2026</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
